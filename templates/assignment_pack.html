<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__COURSE_TITLE__ — Assignment Guides</title>
<style>
  :root{
    --bg:#faf8f5; --bg-alt:#ffffff; --bg-raised:#f1ede6;
    --text:#1a1a1a; --text-dim:#5b5b5b; --border:#e5e1da;
    --accent:#6d54e0; --accent-ink:#ffffff; --accent-soft:#efeafd;
    --good:#0f9d68; --good-soft:#e3f7ee;
    --bad:#e5484d; --bad-soft:#fdeaea;
    --warn:#b8790a; --warn-soft:#fdf1de;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,16,8,.04), 0 8px 24px rgba(20,16,8,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15161c; --bg-alt:#1c1e26; --bg-raised:#242631;
      --text:#f2f1ee; --text-dim:#a7a7b2; --border:#2d2f3a;
      --accent:#9b86ff; --accent-ink:#15161c; --accent-soft:#2a2450;
      --good:#3ecf8e; --good-soft:#0f2e24;
      --bad:#ff6b70; --bad-soft:#3a1c1e;
      --warn:#f0b64c; --warn-soft:#3a2c10;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15161c; --bg-alt:#1c1e26; --bg-raised:#242631;
    --text:#f2f1ee; --text-dim:#a7a7b2; --border:#2d2f3a;
    --accent:#9b86ff; --accent-ink:#15161c; --accent-soft:#2a2450;
    --good:#3ecf8e; --good-soft:#0f2e24;
    --bad:#ff6b70; --bad-soft:#3a1c1e;
    --warn:#f0b64c; --warn-soft:#3a2c10;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  button{font:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}
  aside{width:270px;flex:none;border-right:1px solid var(--border);background:var(--bg-alt);
    padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  aside h1{font-size:15px;margin:0 0 2px}
  aside .hint{font-size:11.5px;color:var(--text-dim);margin:0 0 14px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;
    margin-bottom:4px;border:1px solid transparent}
  .nav-item:hover{background:var(--bg-raised)}
  .nav-item.active{background:var(--accent-soft);border-color:var(--accent)}
  .nav-item .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex:none}
  .nav-item.complete .dot{background:var(--good)}
  .nav-item .nt{flex:1;min-width:0}
  .nav-item .nt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item .nt small{color:var(--text-dim);font-size:11px}
  main{flex:1;min-width:0;padding:30px 34px 80px;max-width:880px}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
  .icon-btn{border:1px solid var(--border);background:var(--bg-alt);color:var(--text);border-radius:10px;
    width:36px;height:36px;display:grid;place-items:center}
  h2{font-size:22px;margin:6px 0 2px}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg-raised);color:var(--text-dim)}
  .pill.accent{background:var(--accent-soft);color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0 20px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--text-dim);font-weight:700;font-size:11.5px;text-transform:uppercase}
  tr:hover td{background:var(--bg-raised)}
  .card{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--border)}
  .checklist label:last-child{border-bottom:none}
  .checklist input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}
  .checklist label.done span{text-decoration:line-through;color:var(--text-dim)}
  .progress-bar{height:7px;border-radius:99px;background:var(--bg-raised);overflow:hidden;margin:10px 0 4px}
  .progress-bar > i{display:block;height:100%;background:var(--good);width:0%;transition:width .3s}
  .step{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;background:var(--bg-alt);overflow:hidden}
  .step.done{opacity:.6}
  .step.done .step-head b{text-decoration:line-through}
  .step-head{padding:13px 15px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .step-head .step-done{width:18px;height:18px;accent-color:var(--good);flex:none}
  .step-head .num{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;
    width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
  .step-head b{flex:1;font-size:14px}
  .step-head small{color:var(--text-dim);font-size:11.5px}
  .chev{color:var(--text-dim);transition:transform .18s}
  .step.open .chev{transform:rotate(180deg)}
  .step-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .step.open .step-body{max-height:2000px}
  .step-inner{padding:0 15px 16px;font-size:13.5px}
  .step-inner p{margin:6px 0}
  pre{background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
    overflow:auto;font-size:12.5px;position:relative}
  pre code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .copy-btn{position:absolute;top:8px;right:8px;font-size:11px;padding:4px 8px;border-radius:6px;
    border:1px solid var(--border);background:var(--bg-alt);color:var(--text)}
  .done-crit{margin-top:8px;padding:8px 10px;background:var(--good-soft);color:var(--good);border-radius:8px;font-size:12.5px}
  .warn-box{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px}
  .how-list{margin:6px 0;padding-left:18px}
  .how-list li{margin:4px 0}
  .glossary-item, .session, .resource{padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .glossary-item:last-child, .session:last-child, .resource:last-child{border-bottom:none}
  .glossary-item b, .session b, .resource b{font-size:13.5px}
  .session .covers{color:var(--text-dim);font-size:12px;display:block;margin:2px 0}
  .session p{margin:4px 0 0}
  .hint-item{background:var(--accent-soft);border-radius:8px;padding:9px 12px;margin:6px 0;font-size:12.5px;display:none}
  .hint-item.show{display:block}
  .btn{border:1px solid var(--border);background:var(--bg-alt);color:var(--text);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
  .btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
  section{display:none}
  section.active{display:block}

  /* progress ring */
  .ring{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--bg-raised) 0);position:relative;margin-bottom:8px}
  .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg-alt)}
  .ring span{position:relative;font-size:10px;font-weight:700}
  @keyframes confetti-fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
  .confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:80;animation:confetti-fall linear forwards;pointer-events:none}

  /* per-step timer */
  .timer-row{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .timer-btn{border:1px solid var(--border);background:var(--bg-raised);color:var(--text);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600}
  .timer-btn:hover{border-color:var(--accent)}
  .timer-disp{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--text-dim)}

  /* quick-review flip cards */
  .deck{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px}
  .deck-meta{display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--text-dim)}
  .flip-card{width:100%;height:170px;perspective:1200px}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:var(--bg-raised)}
  .face.back{transform:rotateY(180deg);background:var(--accent-soft)}
  .face .tag{position:absolute;top:10px;left:12px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-dim);letter-spacing:.04em}
  .face .qtext{font-size:15px;font-weight:700}
  .face .atext{font-size:13.5px}
  .face .hint{position:absolute;bottom:10px;font-size:11px;color:var(--text-dim)}
  .deck-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

  /* resources */
  .resource a{color:var(--accent);text-decoration:none}
  .resource a:hover{text-decoration:underline}
  .res-tag{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-dim);letter-spacing:.03em}

  @media (max-width:800px){
    .app{flex-direction:column}
    aside{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}
    main{padding:20px}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="ring" id="progressRing"><span id="progressPct">0%</span></div>
    <h1 id="sideTitle">__COURSE_TITLE__</h1>
    <p class="hint">Assignment guides</p>
    <div id="navRoot"></div>
  </aside>
  <main>
    <div class="topbar"><button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button></div>
    <section id="view-overview" class="active">
      <h2>Assignment overview</h2>
      <p id="ovBudget" style="color:var(--text-dim);font-size:13.5px"></p>
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Type</th><th>Est. hours</th><th>Due</th></tr></thead>
        <tbody id="ovTable"></tbody>
      </table>
    </section>
    <div id="assignmentViews"></div>
  </main>
</div>

<script id="pack-data" type="application/json">
__ASSIGNMENT_DATA_JSON__
</script>

<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('pack-data').textContent);
  const NS = 'assignpack:' + (DATA.course||'course') + ':' + (DATA.generated_at||'v1') + ':';
  function store(k,v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} }
  function load(k,f){ try{ const v=localStorage.getItem(NS+k); return v===null?f:JSON.parse(v); }catch(e){ return f; } }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme(load('theme', null));
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const currentlyDark = current ? current==='dark' : sysDark;
    const next = currentlyDark ? 'light':'dark';
    applyTheme(next); store('theme', next);
  });

  document.getElementById('sideTitle').textContent = DATA.course || 'Assignments';

  // overview
  const ov = DATA.overview || {};
  document.getElementById('ovBudget').textContent = `Total estimated: ${ov.total_hours||'?'}h` + (ov.recommended_start ? ` · Recommended start: ${ov.recommended_start}` : '');
  const ovBody = document.getElementById('ovTable');
  (ov.assignments||[]).forEach((a,i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${esc(a.est_hours)}h</td><td>${esc(a.due||'—')}</td>`;
    ovBody.appendChild(tr);
  });

  function reqProgress(a){
    const total = (a.requirements||[]).length;
    if(!total) return 1;
    const done = (a.requirements||[]).filter((r,ri)=>load('req:'+a.id+':'+ri,false)).length;
    return done/total;
  }
  function stepProgress(a){
    const total = (a.steps||[]).length;
    if(!total) return 1;
    const done = (a.steps||[]).filter((s,si)=>load('stepdone:'+a.id+':'+si,false)).length;
    return done/total;
  }
  function assignmentProgress(a){
    const parts = [];
    if((a.requirements||[]).length) parts.push(reqProgress(a));
    if((a.steps||[]).length) parts.push(stepProgress(a));
    return parts.length ? parts.reduce((x,y)=>x+y,0)/parts.length : 1;
  }

  // ---------- progress ring + celebration ----------
  let activeAssignment = null;
  const celebrated = {};
  function celebrate(){
    const colors=['#6d54e0','#0f9d68','#f0b64c','#e5484d','#3ecf8e'];
    for(let i=0;i<60;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[i%colors.length];
      c.style.animationDuration=(2+Math.random()*1.5)+'s';
      c.style.transform=`rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 4000);
    }
  }
  function refreshRing(){
    let pct;
    if(activeAssignment){ pct = Math.round(assignmentProgress(activeAssignment)*100); }
    else {
      const list = DATA.assignments||[];
      pct = list.length ? Math.round(list.reduce((s,a)=>s+assignmentProgress(a),0)/list.length*100) : 0;
    }
    document.getElementById('progressRing').style.setProperty('--pct', pct);
    document.getElementById('progressPct').textContent = pct+'%';
    if(activeAssignment && pct>=100 && !celebrated[activeAssignment.id]){ celebrated[activeAssignment.id]=true; celebrate(); }
  }

  // ---------- pomodoro-style step timers ----------
  function beep(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      [660,880].forEach((f,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
        const t0=ctx.currentTime+i*0.18;
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(0.15,t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
        o.start(t0); o.stop(t0+0.32);
      });
    }catch(e){}
  }
  function attachTimer(btn, disp, minutes, doneLabel){
    let remaining = minutes*60, iv = null;
    function render(){ const m=Math.floor(remaining/60), s=remaining%60; disp.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
    render();
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(iv){ clearInterval(iv); iv=null; btn.textContent='▶ Resume'; return; }
      btn.textContent='⏸ Pause';
      iv = setInterval(() => {
        remaining--;
        if(remaining<=0){ clearInterval(iv); iv=null; render(); btn.textContent=doneLabel||'✓ Done'; btn.disabled=true; beep(); return; }
        render();
      }, 1000);
    });
  }

  // nav
  const navRoot = document.getElementById('navRoot');
  const viewsRoot = document.getElementById('assignmentViews');
  const overviewNav = document.createElement('div');
  overviewNav.className = 'nav-item active';
  overviewNav.innerHTML = `<span class="dot"></span><div class="nt"><b>Overview</b><small>All assignments</small></div>`;
  overviewNav.addEventListener('click', () => switchView('overview'));
  navRoot.appendChild(overviewNav);

  (DATA.assignments||[]).forEach((a, ai) => {
    const navItem = document.createElement('div');
    navItem.className = 'nav-item';
    navItem.innerHTML = `<span class="dot"></span><div class="nt"><b>${esc(a.name)}</b><small>${esc(a.type)} · ${esc(a.est_hours)}h</small></div>`;
    navItem.addEventListener('click', () => switchView(a.id));
    navRoot.appendChild(navItem);

    const view = document.createElement('section');
    view.id = 'view-' + a.id;
    view.innerHTML = `
      <h2>${esc(a.name)}</h2>
      <div class="meta-row">
        <span class="pill accent">${esc(a.type)}</span>
        <span class="pill">${esc(a.est_hours)}h estimated</span>
        <span class="pill">Due: ${esc(a.due||'unknown')}</span>
      </div>
      <div class="card"><p>${esc(a.summary)}</p></div>

      ${(a.glossary&&a.glossary.length) ? `
      <h3>🔤 Terms used in this guide</h3>
      <div class="card">
        ${a.glossary.map(g=>`<div class="glossary-item"><b>${esc(g.term)}</b> — ${esc(g.meaning)}</div>`).join('')}
      </div>` : ''}

      ${((a.glossary&&a.glossary.length) || (a.common_mistakes&&a.common_mistakes.length)) ? `
      <h3>🃏 Quick review</h3>
      <p style="color:var(--text-dim);font-size:12.5px;margin:0 0 10px">Flip through these before you start — click a card to reveal the answer.</p>
      <div class="card">
        <div class="deck" id="deck-${a.id}">
          <div class="deck-meta"><span class="fc-pos">1 / 1</span><span class="fc-known">0 known</span></div>
          <div class="progress-bar"><i class="fc-progress"></i></div>
          <div class="flip-card fc-card"><div class="flip-inner">
            <div class="face front"><span class="tag">?</span><div class="qtext fc-q"></div><span class="hint">Click to flip</span></div>
            <div class="face back"><span class="tag">Answer</span><div class="atext fc-a"></div></div>
          </div></div>
          <div class="deck-controls">
            <button class="btn bad fc-dontknow">✗ Still learning</button>
            <button class="btn fc-prev">← Prev</button>
            <button class="btn primary fc-shuffle">🔀 Shuffle</button>
            <button class="btn fc-next">Next →</button>
            <button class="btn good fc-know">✓ I knew it</button>
          </div>
        </div>
      </div>` : ''}

      ${(a.time_plan&&a.time_plan.length) ? `
      <h3>⏱ How to spend your time</h3>
      <div class="card">
        ${a.time_plan.map(t=>`<div class="session"><b>Session ${esc(t.session)} · ${esc(t.hours)}h</b><span class="covers">${esc(t.covers||'')}</span><p>${esc(t.goal||'')}</p></div>`).join('')}
      </div>` : ''}

      ${(a.requirements&&a.requirements.length) ? `
      <h3>✅ Requirements</h3>
      <div class="card checklist" id="req-${a.id}">
        <div class="progress-bar"><i></i></div>
        ${a.requirements.map((r,ri)=>`<label><input type="checkbox" data-ri="${ri}"><span>${esc(r)}</span></label>`).join('')}
      </div>` : ''}

      ${(a.steps&&a.steps.length) ? `<h3>🗺 Step-by-step guide</h3><div id="steps-${a.id}"></div>` : ''}

      ${(a.lecture_refs&&a.lecture_refs.length) ? `
      <h3>🔗 Relevant lecture material</h3>
      <table><thead><tr><th>Concept</th><th>Source</th><th>Slides/Pages</th></tr></thead>
      <tbody>${a.lecture_refs.map(l=>`<tr><td>${esc(l.concept)}</td><td>${esc(l.source)}</td><td>${esc(l.slides||'')}</td></tr>`).join('')}</tbody></table>` : ''}

      ${(a.common_mistakes&&a.common_mistakes.length) ? `
      <h3>⚠ Common mistakes</h3>
      ${a.common_mistakes.map(m=>`<div class="warn-box"><b>${esc(m.mistake)}</b> — ${esc(m.why)}</div>`).join('')}` : ''}

      ${a.testing ? `
      <h3>🧪 How to test your work</h3>
      <div class="card"><p>${esc(a.testing.description||'')}</p>
      ${(a.testing.commands||[]).map(c=>`<pre><code>${esc(c)}</code></pre>`).join('')}</div>` : ''}

      ${(a.hints&&a.hints.length) ? `
      <h3>💡 If you're stuck</h3>
      <div class="card" id="hints-${a.id}"><button class="btn">Reveal next hint (${a.hints.length} available)</button><div class="hint-list"></div></div>` : ''}

      ${(a.resources&&a.resources.length) ? `
      <h3>📚 Resources</h3>
      <div class="card">
        ${a.resources.map(r=>`<div class="resource">${r.type?`<span class="res-tag">${esc(r.type)}</span><br>`:''}<b>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`:esc(r.name)}</b><br>${esc(r.note||'')}</div>`).join('')}
      </div>` : ''}
    `;
    viewsRoot.appendChild(view);

    // requirements
    const reqBox = view.querySelector('#req-'+a.id);
    function refreshAssignment(){
      if(reqBox){
        const pct = Math.round(reqProgress(a)*100);
        reqBox.querySelector('.progress-bar i').style.width = pct+'%';
      }
      navItem.classList.toggle('complete', Math.round(assignmentProgress(a)*100)===100);
      refreshRing();
    }
    if(reqBox){
      reqBox.querySelectorAll('input[type=checkbox]').forEach(cb => {
        const ri = cb.dataset.ri;
        cb.checked = load('req:'+a.id+':'+ri, false);
        cb.closest('label').classList.toggle('done', cb.checked);
        cb.addEventListener('change', () => { store('req:'+a.id+':'+ri, cb.checked); cb.closest('label').classList.toggle('done', cb.checked); refreshAssignment(); });
      });
      refreshAssignment();
    }

    // quick-review deck (glossary + common mistakes)
    const deckEl = view.querySelector('#deck-'+a.id);
    if(deckEl){
      const cards = [
        ...(a.glossary||[]).map(g=>({q:g.term, a:g.meaning})),
        ...(a.common_mistakes||[]).map(m=>({q:'Mistake: '+m.mistake, a:m.why})),
      ];
      let order = cards.map((c,i)=>i), pos = 0;
      const cardEl = deckEl.querySelector('.fc-card');
      const qEl = deckEl.querySelector('.fc-q'), aEl = deckEl.querySelector('.fc-a');
      const posEl = deckEl.querySelector('.fc-pos'), knownEl = deckEl.querySelector('.fc-known'), progEl = deckEl.querySelector('.fc-progress');
      function show(){
        const idx = order[pos];
        cardEl.classList.remove('flipped');
        qEl.textContent = cards[idx].q; aEl.textContent = cards[idx].a;
        posEl.textContent = (pos+1)+' / '+order.length;
        const knownCount = cards.filter((c,i)=>load('qr:'+a.id+':'+i,null)==='known').length;
        knownEl.textContent = knownCount + ' known';
        progEl.style.width = Math.round((knownCount/cards.length)*100)+'%';
      }
      cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
      deckEl.querySelector('.fc-next').addEventListener('click', () => { pos = (pos+1) % order.length; show(); });
      deckEl.querySelector('.fc-prev').addEventListener('click', () => { pos = (pos-1+order.length) % order.length; show(); });
      deckEl.querySelector('.fc-shuffle').addEventListener('click', () => { order = order.sort(()=>Math.random()-0.5); pos=0; show(); });
      deckEl.querySelector('.fc-know').addEventListener('click', () => { store('qr:'+a.id+':'+order[pos],'known'); deckEl.querySelector('.fc-next').click(); });
      deckEl.querySelector('.fc-dontknow').addEventListener('click', () => { store('qr:'+a.id+':'+order[pos],'learning'); deckEl.querySelector('.fc-next').click(); });
      show();
    }

    // steps
    const stepsRoot = view.querySelector('#steps-'+a.id);
    if(stepsRoot){
      (a.steps||[]).forEach((s, si) => {
        const key = 'step:'+a.id+':'+si;
        const doneKey = 'stepdone:'+a.id+':'+si;
        const div = document.createElement('div');
        div.className = 'step' + (load(key,false)?' open':'');
        div.innerHTML = `<div class="step-head">
            <input type="checkbox" class="step-done" title="Mark step done">
            <span class="num">${si+1}</span><b>${esc(s.title)}</b><small>${esc(s.est_minutes||'?')} min</small><span class="chev">▾</span>
          </div>
          <div class="step-body"><div class="step-inner">
            ${s.goal?`<p><b>Goal:</b> ${esc(s.goal)}</p>`:''}
            ${Array.isArray(s.how) ? `<ul class="how-list">${s.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>` : `<p>${esc(s.how)}</p>`}
            ${s.code_scaffold ? `<pre><button class="copy-btn">Copy</button><code>${esc(s.code_scaffold.code)}</code></pre>` : ''}
            ${s.done_when?`<div class="done-crit">Done when: ${esc(s.done_when)}</div>`:''}
            <div class="timer-row"><button class="timer-btn">▶ Start ${esc(s.est_minutes||25)} min timer</button><span class="timer-disp"></span></div>
          </div></div>`;
        div.querySelector('.step-head').addEventListener('click', () => { div.classList.toggle('open'); store(key, div.classList.contains('open')); });
        const doneCb = div.querySelector('.step-done');
        doneCb.checked = load(doneKey, false);
        div.classList.toggle('done', doneCb.checked);
        doneCb.addEventListener('click', e => e.stopPropagation());
        doneCb.addEventListener('change', () => { store(doneKey, doneCb.checked); div.classList.toggle('done', doneCb.checked); refreshAssignment(); });
        attachTimer(div.querySelector('.timer-btn'), div.querySelector('.timer-disp'), s.est_minutes||25, '✓ Time!');
        const copyBtn = div.querySelector('.copy-btn');
        if(copyBtn) copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const code = s.code_scaffold.code;
          if(navigator.clipboard) navigator.clipboard.writeText(code).catch(()=>{});
          copyBtn.textContent = 'Copied!'; setTimeout(()=>copyBtn.textContent='Copy', 1200);
        });
        stepsRoot.appendChild(div);
      });
    }

    // hints
    const hintsBox = view.querySelector('#hints-'+a.id);
    if(hintsBox){
      let shown = 0;
      const listEl = hintsBox.querySelector('.hint-list');
      const btn = hintsBox.querySelector('button');
      btn.addEventListener('click', () => {
        if(shown >= a.hints.length) return;
        const d = document.createElement('div'); d.className='hint-item show'; d.textContent = a.hints[shown];
        listEl.appendChild(d);
        shown++;
        if(shown>=a.hints.length){ btn.disabled=true; btn.textContent='No more hints'; }
        else btn.textContent = `Reveal next hint (${a.hints.length-shown} left)`;
      });
    }
  });

  function switchView(id){
    document.querySelectorAll('#assignmentViews section, #view-overview').forEach(s => s.classList.remove('active'));
    document.getElementById('view-'+id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const items = navRoot.querySelectorAll('.nav-item');
    if(id==='overview'){ items[0].classList.add('active'); activeAssignment = null; }
    else {
      const idx = (DATA.assignments||[]).findIndex(a=>a.id===id);
      if(idx>-1) items[idx+1].classList.add('active');
      activeAssignment = (DATA.assignments||[]).find(a=>a.id===id) || null;
    }
    refreshRing();
    window.scrollTo(0,0);
  }
  refreshRing();
})();
</script>
</body>
</html>
